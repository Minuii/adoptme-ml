name: pages

on:
  # Rebuilt after every scrape run (every 15 minutes; GitHub's own `schedule:` never fires for this repo), on site edits, or by hand.
  push:
    branches: [main]
    paths: [site/**, build_site.py, track_record.py]  # forecast.yml dispatches a rebuild after each daily forecast
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
