name: scrape

on:
  # Started every 15 min by cron-job.org (POST .../actions/workflows/scrape.yml/dispatches with a fine-grained token).
  # GitHub's own `schedule:` never fired for this repo, so it was removed. See log.md.
  workflow_dispatch:
    inputs:
      job:
        description: "auto | values | trades"
        default: auto

permissions:
  contents: write
  actions: write  # to start the pages workflow (see last step)

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # trades + ads (~1 min); values/updates runs take longer
    steps:
      - uses: actions/checkout@v4
      # stdlib only, so the runner's own python3 does; skipping setup-python keeps runs under the 1-minute billing step
      - run: python3 scraper.py ${{ inputs.job || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two overlapping runs both append to the same day's trades file, so a plain rebase can conflict.
          # On conflict: drop our commit, take the newest data, scrape again on top of it (dedupes), retry.
          for attempt in 1 2 3; do
            git add data STATS.md
            git diff --cached --quiet && exit 0
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch -q && git reset -q --hard origin/main
            python3 scraper.py ${{ inputs.job || 'auto' }}
          done
          exit 1
      # The live site (pages.yml) rebuilds from the committed data. Pushes made with the workflow token don't start
      # other workflows, but a dispatch does. Hourly, on the :00 run, right after the hourly values check.
      - name: Rebuild the live site every hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%M) )) -lt 15 ]; then
            gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          fi
