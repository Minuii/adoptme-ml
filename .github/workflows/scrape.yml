name: scrape

on:
  # Started every 15 min by cron-job.org (POST .../actions/workflows/scrape.yml/dispatches with a fine-grained token).
  # GitHub's own `schedule:` never fired for this repo, so it was removed. See log.md.
  workflow_dispatch:
    inputs:
      job:
        description: "auto | values | trades"
        default: auto

permissions:
  contents: write
  actions: write  # to start the pages workflow (see below)

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  JOB: ${{ inputs.job || 'auto' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 14  # ~1-2 min of collecting, then two more trade polls 5 min apart; the next run starts at +15
    steps:
      - uses: actions/checkout@v7
      # stdlib only, so the runner's own python3 does (no setup-python needed)
      - run: python3 scraper.py "$JOB"
      - name: Commit data
        run: bash .github/commit_data.sh "$JOB"
      # The live site (pages.yml) rebuilds from the committed data. Pushes made with the workflow token don't start
      # other workflows, but a dispatch does. Hourly, on the :00 run, right after the hourly values check.
      - name: Rebuild the live site every hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%M) )) -lt 15 ]; then
            gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
            # once a day, after Elvebredd's evening updates: refresh the 30-day forecast (forecast.yml rebuilds the site after)
            if [ "$(date -u +%H)" = "01" ]; then
              gh workflow run forecast.yml --ref main --repo "$GITHUB_REPOSITORY"
            fi
          fi
      # AMVGG's completed-trades page holds ~100 trades: about 17 minutes at peak, so one poll per 15-minute run lost
      # trades (7 of the first 90 runs found the whole page new). Two more polls make it one every 5 minutes.
      - name: Two more trade polls, 5 minutes apart
        if: env.JOB == 'auto'
        run: |
          for i in 1 2; do
            sleep 285
            python3 scraper.py trades || echo "trade poll $i failed"
          done
          python3 scraper.py stats
          bash .github/commit_data.sh trades
      # Last, so data is always committed first: fails the run (GitHub emails the owner) if a collector has gone quiet.
      - name: Check every collector is still bringing data
        run: python3 scraper.py health
