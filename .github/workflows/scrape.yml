name: scrape

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 min, off the hour (GitHub delays :00 runs most)
  workflow_dispatch:
    inputs:
      job:
        description: "auto | values | trades"
        default: auto

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py ${{ inputs.job || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
