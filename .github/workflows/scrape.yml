name: scrape

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 min, off the hour (GitHub delays :00 runs most)
  workflow_dispatch:
    inputs:
      job:
        description: "auto | values | trades"
        default: auto

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # trades + ads (~1 min); values/updates runs take longer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py ${{ inputs.job || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two overlapping runs both append to the same day's trades file, so a plain rebase can conflict.
          # On conflict: drop our commit, take the newest data, scrape again on top of it (dedupes), retry.
          for attempt in 1 2 3; do
            git add data STATS.md
            git diff --cached --quiet && exit 0
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch -q && git reset -q --hard origin/main
            python scraper.py ${{ inputs.job || 'auto' }}
          done
          exit 1
