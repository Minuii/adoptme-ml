name: forecast

on:
  # Started once a day by the scrape workflow's 01:00 UTC run (after Elvebredd's evening value updates), or by hand.
  # Trains the direction model on all data for 7, 30 and 90 days ahead and writes results/direction_<H>d.csv
  # (item pages show 30 days; the side panel switches between all three) plus the day's calls in results/forecast_log/.
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # to rebuild the site afterwards

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ~10-15 min per run: features, one boosting fit on ~1.4M rows (3 real + 2 trial runs)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          H=30 python elve_model.py forecast  # item pages and the track record need this one
          for h in 7 90; do H=$h python elve_model.py forecast || echo "::warning::the $h-day forecast failed; the panel keeps the last one"; done
      - name: Live trial with AMVGG features (scored on the Stats tab; never blocks the real forecast)
        continue-on-error: true
        run: |
          for h in 7 30; do H=$h python elve_model.py forecast amvgg || echo "::warning::the $h-day AMVGG trial failed"; done
      - name: Commit the forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/keep" && cp results/direction_*.csv "$RUNNER_TEMP/keep/" && cp -r results/forecast_log "$RUNNER_TEMP/forecast_log"
          for attempt in 1 2 3; do
            git add results/direction_*.csv results/forecast_log
            git diff --cached --quiet && exit 0
            git commit -q -m "forecast: as of $(head -1 results/direction_30d.csv | cut -d' ' -f4)"
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            git fetch -q && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/keep/"* results/ && cp -r "$RUNNER_TEMP/forecast_log/." results/forecast_log/
          done
          exit 1
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
